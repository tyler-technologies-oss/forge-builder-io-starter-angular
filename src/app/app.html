<forge-app-layout [attr.app-title]="title()" app-title-href="/">
  <forge-icon slot="app-bar-logo" name="home"></forge-icon>

  <div slot="app-bar-end" class="flex items-center gap-xsmall">
    <forge-icon-button density="medium" aria-label="Notifications" theme="app-bar">
      <forge-icon name="notifications" external></forge-icon>
    </forge-icon-button>

    <forge-user-profile
      full-name="Tyler Tech"
      email="tyler.tech@tylertech.com"
      button-label="Open the user profile menu"
      theme-toggle
    >
      <forge-profile-link slot="link">
        <forge-icon slot="icon" name="settings" external></forge-icon>
        <a href="#">Settings</a>
      </forge-profile-link>
      <forge-profile-link slot="link">
        <forge-icon slot="icon" name="account" external></forge-icon>
        <a href="#">Profile</a>
      </forge-profile-link>
      <span slot="sign-out-button-text">Sign out</span>
    </forge-user-profile>
  </div>

  <forge-list slot="navigation" navlist data-forge-app-layout-close>
    <forge-list-item [selected]="activeRoute() === 'dashboard'">
      <forge-icon slot="start" name="dashboard"></forge-icon>
      <a routerLink="/dashboard">Dashboard</a>
    </forge-list-item>
    <forge-list-item [selected]="activeRoute() === 'sample-page'">
      <forge-icon slot="start" name="table"></forge-icon>
      <a routerLink="/sample-page">Sample page</a>
    </forge-list-item>
  </forge-list>

  <div slot="body-header">
    <forge-toolbar>
      <h2 slot="start" class="text-heading3">{{ pageTitle() }}</h2>
    </forge-toolbar>
  </div>

  <main slot="body" class="p-medium">
    <router-outlet></router-outlet>
  </main>

  <footer slot="body-footer">
    <forge-toolbar inverted>
      <div slot="center" class="text-body1">© 2026 {{ title() }}. All rights reserved.</div>
    </forge-toolbar>
  </footer>
</forge-app-layout>
