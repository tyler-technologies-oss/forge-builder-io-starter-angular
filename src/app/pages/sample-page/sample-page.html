<div class="flex flex-col gap-medium p-medium">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-medium">
    <forge-count-card>
      <forge-icon slot="icon" name="games"></forge-icon>
      <span slot="label">Total games</span>
      <span slot="count">{{ totalGames() }}</span>
    </forge-count-card>

    <forge-count-card theme="info">
      <forge-icon slot="icon" name="business"></forge-icon>
      <span slot="label">Publishers</span>
      <span slot="count">{{ uniquePublishers() }}</span>
    </forge-count-card>

    <forge-count-card theme="success">
      <forge-icon slot="icon" name="devices"></forge-icon>
      <span slot="label">Platforms</span>
      <span slot="count">{{ uniquePlatforms() }}</span>
    </forge-count-card>

    <forge-count-card theme="tertiary">
      <forge-icon slot="icon" name="calendar"></forge-icon>
      <span slot="label">Year range</span>
      <span slot="count">{{ yearRange() }}</span>
    </forge-count-card>
  </div>

  <forge-card no-padding>
    <forge-toolbar>
      <h3 slot="start" class="text-heading3">Top 30 Video Games of All Time</h3>
    </forge-toolbar>
    <forge-table [data]="games()" [columnConfigurations]="columns"></forge-table>
  </forge-card>
</div>
